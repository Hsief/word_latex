name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  PRODUCT_VERSION: 1.0.2

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Create an ephemeral manifest certificate
        id: certificate
        shell: powershell
        run: |
          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject 'CN=WordLatexVSTO Community Build' `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -KeyExportPolicy Exportable `
            -NotAfter (Get-Date).AddYears(2)
          Export-Certificate -Cert $cert -FilePath .\installer\setup\WordLatexVSTO.cer | Out-Null
          "thumbprint=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build solution
        shell: powershell
        run: |
          msbuild WordLatexVSTO.sln /restore /t:Rebuild /m `
            /p:Configuration=Release /p:Platform="Any CPU" `
            /p:SignManifests=true `
            /p:ManifestCertificateThumbprint="${{ steps.certificate.outputs.thumbprint }}"

      - name: Run converter and scanner tests
        shell: powershell
        run: .\tests\AfterMathCore.Tests\bin\Release\AfterMathCore.Tests.exe

      - name: Publish VSTO deployment
        shell: powershell
        run: |
          Remove-Item .\installer\publish\* -Recurse -Force -ErrorAction SilentlyContinue
          $publish = (Resolve-Path .\installer\publish).Path + '\'
          msbuild .\src\WordLatexAddin\WordLatexAddin.csproj /t:Publish /m `
            /p:Configuration=Release /p:Platform=AnyCPU `
            /p:PublishUrl="$publish" /p:ApplicationVersion="$env:PRODUCT_VERSION.0" `
            /p:SignManifests=true `
            /p:ManifestCertificateThumbprint="${{ steps.certificate.outputs.thumbprint }}"
          Copy-Item .\src\WordLatexAddin\bin\Release\app.publish\* .\installer\publish\ -Recurse -Force
          if (-not (Test-Path .\installer\publish\WordLatexAddin.vsto)) {
            throw 'VSTO deployment manifest was not generated.'
          }

      - name: Build installer
        shell: powershell
        run: |
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' }
          & $iscc "/DMyAppVersion=$env:PRODUCT_VERSION" "/DSigningCertificateThumbprint=${{ steps.certificate.outputs.thumbprint }}" .\installer\setup\WordLatexVSTO.iss
          if (-not (Test-Path .\installer\publish\WordLatexVSTO_Setup.exe)) {
            throw 'Installer was not generated.'
          }

      - name: Package release
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path .\release -Force | Out-Null
          Copy-Item .\installer\publish\WordLatexVSTO_Setup.exe .\release\
          Copy-Item .\README.md, .\docs\INSTALL.md, .\docs\USER_GUIDE.md, .\LICENSE, .\THIRD_PARTY_NOTICES.md .\release\
          Compress-Archive -Path .\release\* -DestinationPath .\WordLatexVSTO-$env:PRODUCT_VERSION.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WordLatexVSTO-${{ env.PRODUCT_VERSION }}
          path: |
            installer/publish/WordLatexVSTO_Setup.exe
            WordLatexVSTO-${{ env.PRODUCT_VERSION }}.zip
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:PRODUCT_VERSION"
          $ErrorActionPreference = 'Continue'
          gh release view $tag *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          $ErrorActionPreference = 'Stop'
          if ($releaseExists) {
            gh release upload $tag .\installer\publish\WordLatexVSTO_Setup.exe .\WordLatexVSTO-$env:PRODUCT_VERSION.zip --clobber
          } else {
            gh release create $tag .\installer\publish\WordLatexVSTO_Setup.exe .\WordLatexVSTO-$env:PRODUCT_VERSION.zip `
              --target "$env:GITHUB_SHA" `
              --title "WordLatexVSTO $env:PRODUCT_VERSION" `
              --notes "Installable Word VSTO add-in with LaTeX scanning, native OMML conversion, automatic mode, equation numbering, and cross-references."
          }

