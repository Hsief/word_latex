name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  PRODUCT_VERSION: 1.0.4

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Create an ephemeral manifest certificate
        id: certificate
        shell: powershell
        run: |
          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject 'CN=WordLatexVSTO Community Build' `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -KeyExportPolicy Exportable `
            -NotAfter (Get-Date).AddYears(2)
          "thumbprint=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build solution
        shell: powershell
        run: |
          msbuild WordLatexVSTO.sln /restore /t:Rebuild /m `
            /p:Configuration=Release /p:Platform="Any CPU" `
            /p:SignManifests=true `
            /p:ManifestCertificateThumbprint="${{ steps.certificate.outputs.thumbprint }}"

      - name: Run converter and scanner tests
        shell: powershell
        run: .\tests\AfterMathCore.Tests\bin\Release\AfterMathCore.Tests.exe

      - name: Publish VSTO deployment
        shell: powershell
        run: |
          $stage = Join-Path $env:GITHUB_WORKSPACE 'installer\staging'
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          msbuild .\src\WordLatexAddin\WordLatexAddin.csproj /t:Publish /m `
            /p:Configuration=Release /p:Platform=AnyCPU `
            "/p:PublishUrl=$stage\" /p:ApplicationVersion="$env:PRODUCT_VERSION.0" `
            /p:SignManifests=true `
            /p:ManifestCertificateThumbprint="${{ steps.certificate.outputs.thumbprint }}"
          Copy-Item .\src\WordLatexAddin\bin\Release\app.publish\* $stage -Recurse -Force
          if (-not (Test-Path "$stage\WordLatexVSTOAddin.vsto")) {
            throw 'VSTO deployment manifest was not generated.'
          }
          Get-ChildItem "$stage\Application Files" -Recurse -File -Filter '*.deploy' | ForEach-Object {
            $target = $_.FullName.Substring(0, $_.FullName.Length - '.deploy'.Length)
            Copy-Item -LiteralPath $_.FullName -Destination $target -Force
          }
          $versionDirectory = "$stage\Application Files\WordLatexVSTOAddin_$($env:PRODUCT_VERSION.Replace('.', '_'))_0"
          if (-not (Test-Path "$versionDirectory\WordLatexVSTOAddin.dll")) {
            throw 'The local VSTO layout is missing WordLatexVSTOAddin.dll.'
          }
          New-Item -ItemType Directory -Path "$stage\docs" -Force | Out-Null
          Copy-Item .\docs\INSTALL.md, .\docs\USER_GUIDE.md "$stage\docs\" -Force
          Copy-Item .\README.md, .\LICENSE, .\THIRD_PARTY_NOTICES.md $stage -Force

      - name: Build Windows Installer package
        shell: powershell
        run: |
          $wix = Get-ChildItem 'C:\Program Files (x86)\WiX Toolset v3.*\bin\candle.exe' -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $wix) {
            choco install wixtoolset -y --no-progress
            $wix = Get-ChildItem 'C:\Program Files (x86)\WiX Toolset v3.*\bin\candle.exe' -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending | Select-Object -First 1
          }
          if (-not $wix) { throw 'WiX Toolset v3 was not found.' }
          $wixBin = Split-Path $wix.FullName
          $stage = (Resolve-Path .\installer\staging).Path
          $obj = '.\installer\setup\obj'
          Remove-Item $obj -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $obj -Force | Out-Null
          & "$wixBin\heat.exe" dir $stage -nologo -cg PublishedFiles -dr INSTALLFOLDER `
            -gg -g1 -sfrag -srd -sreg -var var.PublishDir `
            -out .\installer\setup\HarvestedFiles.wxs
          if ($LASTEXITCODE -ne 0) { throw 'WiX file harvesting failed.' }
          & "$wixBin\candle.exe" -nologo -arch x64 `
            "-dProductVersion=$env:PRODUCT_VERSION" `
            -out "$obj\Product.wixobj" .\installer\setup\Product.wxs
          if ($LASTEXITCODE -ne 0) { throw 'WiX product compilation failed.' }
          & "$wixBin\candle.exe" -nologo -arch x64 `
            "-dPublishDir=$stage" `
            -out "$obj\HarvestedFiles.wixobj" .\installer\setup\HarvestedFiles.wxs
          if ($LASTEXITCODE -ne 0) { throw 'WiX payload compilation failed.' }
          Remove-Item .\installer\publish\* -Recurse -Force -ErrorAction SilentlyContinue
          & "$wixBin\light.exe" -nologo `
            -out .\installer\publish\WordLatexVSTO.msi `
            "$obj\Product.wixobj" "$obj\HarvestedFiles.wixobj"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path .\installer\publish\WordLatexVSTO.msi)) {
            throw 'MSI package was not generated.'
          }

      - name: Build setup launcher
        shell: powershell
        run: |
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' }
          & $iscc "/DMyAppVersion=$env:PRODUCT_VERSION" .\installer\setup\WordLatexVSTO.iss
          if (-not (Test-Path .\installer\publish\WordLatexVSTO_Setup.exe)) {
            throw 'Setup launcher was not generated.'
          }

      - name: Package release
        shell: powershell
        run: |
          Remove-Item .\release -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path .\release -Force | Out-Null
          Copy-Item .\installer\publish\WordLatexVSTO_Setup.exe, .\installer\publish\WordLatexVSTO.msi .\release\
          Copy-Item .\README.md, .\docs\INSTALL.md, .\docs\USER_GUIDE.md, .\LICENSE, .\THIRD_PARTY_NOTICES.md .\release\
          Compress-Archive -Path .\release\* -DestinationPath .\WordLatexVSTO-$env:PRODUCT_VERSION.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WordLatexVSTO-${{ env.PRODUCT_VERSION }}
          path: |
            installer/publish/WordLatexVSTO_Setup.exe
            installer/publish/WordLatexVSTO.msi
            WordLatexVSTO-${{ env.PRODUCT_VERSION }}.zip
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:PRODUCT_VERSION"
          $ErrorActionPreference = 'Continue'
          gh release view $tag *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          $ErrorActionPreference = 'Stop'
          $assets = @(
            '.\installer\publish\WordLatexVSTO_Setup.exe',
            '.\installer\publish\WordLatexVSTO.msi',
            ".\WordLatexVSTO-$env:PRODUCT_VERSION.zip"
          )
          if ($releaseExists) {
            gh release upload $tag $assets --clobber
          } else {
            gh release create $tag $assets `
              --target "$env:GITHUB_SHA" `
              --title "WordLatexVSTO $env:PRODUCT_VERSION" `
              --notes "MSI-based Program Files deployment with native OMML conversion, automatic mode, equation numbering, and post-install automation verification support."
          }
